  - {key: "sys.report_date", label: "Report date (DD-MM-YYYY)", dtype: "text", source: "system", report_label: "Date", multi: true, order: 836}
  - {key: "sys.ulr_base", label: "ULR number (without trailing F)", dtype: "text", source: "system", report_label: "ULR", multi: true, order: 837}
  - {key: "sys.seal12", label: "Seal: first 12 characters of the snapshot SHA-256", dtype: "text", source: "system", report_label: "Seal", multi: true, order: 838}
  - {key: "sys.engineer_name", label: "Responsible test engineer", dtype: "text", source: "system", report_label: "Test Engineer", multi: true, order: 839}
  - {key: "sys.reviewer_name", label: "HOD - Reviewed and Authorized by", dtype: "text", source: "system", report_label: "Reviewed and Authorized by", multi: true, order: 840}
