  - {key: "sys.test_dates", label: "Date(s) of test(s)", dtype: "text", source: "system", report_label: "Date(s) of Test (s)", order: 842}
  - {key: "sys.tests_particulars", label: "Particulars of tests conducted", dtype: "text", source: "system", report_label: "Particulars of tests conducted", order: 843}
  - {key: "sys.standard", label: "Standard text", dtype: "text", source: "system", report_label: "Test in accordance with Standard / specification", multi: true, order: 844}
  - {key: "sys.sc_standard", label: "Short-circuit standard text", dtype: "text", source: "system", report_label: "Sub-clause of IS: 2026 (Part-5)", multi: true, order: 845}
  - {key: "sys.deviations", label: "Deviations", dtype: "text", source: "system", report_label: "Deviations if any", order: 846}
  - {key: "sys.n_sheets", label: "Number of sheets", dtype: "text", source: "system", multi: true, order: 847}
  - {key: "sys.n_sheets_words", label: "Number of sheets (words)", dtype: "text", source: "system", report_label: "Number of Sheet(s)", order: 848}
  - {key: "sys.n_osc_words", label: "Number of oscillograms (words)", dtype: "text", source: "system", report_label: "Number of Oscillogram (s)", order: 849}
  - {key: "sys.n_graph_words", label: "Number of graphs (words)", dtype: "text", source: "system", report_label: "Number of Graph (s)", order: 850}
  - {key: "sys.n_photo_words", label: "Number of photographs (words)", dtype: "text", source: "system", report_label: "Number of Photograph(s)", order: 851}
  - {key: "sys.n_circuit_words", label: "Number of test circuit diagrams (words)", dtype: "text", source: "system", report_label: "Number of Test Circuit Diagram(s)", order: 852}
  - {key: "sys.n_drawing_words", label: "Number of drawings (words)", dtype: "text", source: "system", report_label: "Number of Drawing(s)", order: 853}
  - {key: "sys.osc_list", label: "Oscillogram numbers", dtype: "text", source: "system", report_label: "4. Oscillogram number(s)", order: 854}
  - {key: "sys.graph_list", label: "Graph numbers", dtype: "text", source: "system", report_label: "5. Graph number(s)", order: 855}
  - {key: "sys.photo_list", label: "Photograph numbers", dtype: "text", source: "system", report_label: "6. Photograph number(s)", order: 856}
  - {key: "sys.circuit_list", label: "Test circuit diagram numbers", dtype: "text", source: "system", report_label: "7. Test circuit diagram number(s)", order: 857}
  - {key: "sys.circuit_no", label: "Test circuit drawing number", dtype: "text", source: "system", report_label: "Test circuit drawing number", multi: true, order: 858}
