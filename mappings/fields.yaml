  # ---------------- computed
  - {key: "calc.r75.hv.bt.n", label: "HV resistance at 75 °C, Principal tap, Before SCW test", unit: "Ω", dtype: "number", dp: 4, source: "computed", test_code: "winding_res", formula: "r75(avg(wr.hv.n.bt.uv, wr.hv.n.bt.vw, wr.hv.n.bt.wu), wtemp('bt'))", stage: "pre", report_label: "HV winding resistance at 75 °C (Ω) -average || Before SCW test Principal", order: 741}
  - {key: "calc.r75.hv.bt.h", label: "HV resistance at 75 °C, Highest tap, Before SCW test", unit: "Ω", dtype: "number", dp: 4, source: "computed", test_code: "winding_res", formula: "r75(avg(wr.hv.h.bt.uv, wr.hv.h.bt.vw, wr.hv.h.bt.wu), wtemp('bt'))", stage: "pre", report_label: "HV winding resistance at 75 °C (Ω) -average || Before SCW test Highest", order: 742}
  - {key: "calc.r75.hv.bt.l", label: "HV resistance at 75 °C, Lowest tap, Before SCW test", unit: "Ω", dtype: "number", dp: 4, source: "computed", test_code: "winding_res", formula: "r75(avg(wr.hv.l.bt.uv, wr.hv.l.bt.vw, wr.hv.l.bt.wu), wtemp('bt'))", stage: "pre", report_label: "HV winding resistance at 75 °C (Ω) -average || Before SCW test Lowest", order: 743}
  - {key: "calc.r75.lv.bt", label: "LV resistance at 75 °C, Before SCW test", unit: "mΩ", dtype: "number", dp: 4, source: "computed", test_code: "winding_res", formula: "r75(avg(wr.lv.bt.uv, wr.lv.bt.vw, wr.lv.bt.wu), wtemp('bt'))", stage: "pre", report_label: "LV winding resistance at 75 °C (mΩ) -average || Before SCW test", order: 744}
  - {key: "calc.r75.hv.at.n", label: "HV resistance at 75 °C, Principal tap, After SCW test", unit: "Ω", dtype: "number", dp: 4, source: "computed", test_code: "winding_res", formula: "r75(avg(wr.hv.n.at.uv, wr.hv.n.at.vw, wr.hv.n.at.wu), wtemp('at'))", stage: "pre", report_label: "HV winding resistance at 75 °C (Ω) -average || After SCW test Principal", order: 745}
  - {key: "calc.r75.hv.at.h", label: "HV resistance at 75 °C, Highest tap, After SCW test", unit: "Ω", dtype: "number", dp: 4, source: "computed", test_code: "winding_res", formula: "r75(avg(wr.hv.h.at.uv, wr.hv.h.at.vw, wr.hv.h.at.wu), wtemp('at'))", stage: "pre", report_label: "HV winding resistance at 75 °C (Ω) -average || After SCW test Highest", order: 746}
  - {key: "calc.r75.hv.at.l", label: "HV resistance at 75 °C, Lowest tap, After SCW test", unit: "Ω", dtype: "number", dp: 4, source: "computed", test_code: "winding_res", formula: "r75(avg(wr.hv.l.at.uv, wr.hv.l.at.vw, wr.hv.l.at.wu), wtemp('at'))", stage: "pre", report_label: "HV winding resistance at 75 °C (Ω) -average || After SCW test Lowest", order: 747}
  - {key: "calc.r75.lv.at", label: "LV resistance at 75 °C, After SCW test", unit: "mΩ", dtype: "number", dp: 4, source: "computed", test_code: "winding_res", formula: "r75(avg(wr.lv.at.uv, wr.lv.at.vw, wr.lv.at.wu), wtemp('at'))", stage: "pre", report_label: "LV winding resistance at 75 °C (mΩ) -average || After SCW test", order: 748}
  - {key: "calc.i_rated", label: "Rated LV current", unit: "A", dtype: "number", dp: 3, source: "computed", formula: "rated_current()", stage: "pre", order: 749}
  - {key: "calc.nlc100.bt", label: "No-load current at 100 % V, Before SCW test", unit: "%", dtype: "number", dp: 2, source: "computed", test_code: "nll", formula: "nll.bt.i / rated_current() * 100", stage: "pre", order: 750}
  - {key: "calc.nlc100.at", label: "No-load current at 100 % V, After SCW test", unit: "%", dtype: "number", dp: 2, source: "computed", test_code: "nll", formula: "nll.at.i / rated_current() * 100", stage: "pre", order: 751}
  - {key: "calc.nlc112", label: "No-load current at 112.5 % V", unit: "%", dtype: "number", dp: 2, source: "computed", test_code: "nlc_112", formula: "nll.o112.i / rated_current() * 100", stage: "pre", order: 752}
  - {key: "calc.xchg.nt", label: "% change in reactance, Principal tap", unit: "%", dtype: "number", dp: 3, source: "computed", test_code: "sc_withstand", formula: "(calc.nt.bt.x50 - calc.nt.at.x50) / calc.nt.bt.x50 * 100", stage: "pre", report_label: "Principal || % change in X", order: 753}
  - {key: "calc.xchg.ht", label: "% change in reactance, Highest tap", unit: "%", dtype: "number", dp: 3, source: "computed", test_code: "sc_withstand", formula: "(calc.ht.bt.x50 - calc.ht.at.x50) / calc.ht.bt.x50 * 100", stage: "pre", report_label: "Highest || % change in X", order: 754}
  - {key: "calc.xchg.lt", label: "% change in reactance, Lowest tap", unit: "%", dtype: "number", dp: 3, source: "computed", test_code: "sc_withstand", formula: "(calc.lt.bt.x50 - calc.lt.at.x50) / calc.lt.bt.x50 * 100", stage: "pre", report_label: "Lowest || % change in X", order: 755}
  - {key: "calc.tr.hv", label: "HV winding temperature rise", unit: "°C", dtype: "number", dp: 1, source: "computed", test_code: "temp_rise", formula: "tr.hot.hv / tr.cold.hv * (K + tr.cold.amb) - K - tr.amb_shutdown + tr.corr.hv", stage: "pre", report_label: "HV winding || Temperature-rise (°C)", order: 756}
  - {key: "calc.tr.lv", label: "LV winding temperature rise", unit: "°C", dtype: "number", dp: 1, source: "computed", test_code: "temp_rise", formula: "tr.hot.lv / tr.cold.lv * (K + tr.cold.amb) - K - tr.amb_shutdown + tr.corr.lv", stage: "pre", report_label: "LV winding || Temperature-rise (°C)", order: 757}
  - {key: "calc.tr.top", label: "Top-oil temperature rise", unit: "°C", dtype: "number", dp: 1, source: "computed", test_code: "temp_rise", formula: "tr.top_oil_rise", stage: "pre", report_label: "Top oil || Temperature-rise (°C)", order: 758}
  - {key: "calc.tr.lastrise", label: "Top-oil rise at last hourly reading", unit: "°C", dtype: "number", dp: 2, source: "computed", formula: "last_rise()", stage: "pre", order: 759}
  - {key: "calc.defl.air", label: "Max deflection from reference points (air pressure)", unit: "mm", dtype: "number", dp: 2, source: "computed", formula: "max_defl('prt')", stage: "pre", order: 760}
  - {key: "calc.defl.vac", label: "Max deflection from reference points (vacuum)", unit: "mm", dtype: "number", dp: 2, source: "computed", formula: "max_defl('prv')", stage: "pre", order: 761}
  - {key: "rep.ir.bt.hv_e", label: "IR hv_e Before SCW test (text)", dtype: "text", source: "computed", test_code: "ir", formula: "f(ir.bt.hv_e, 2) + ' GΩ'", stage: "pre", report_label: "HV winding with respect to LV winding & tank connected together and earthed. || Before SCW test", order: 762}
  - {key: "rep.ir.bt.lv_e", label: "IR lv_e Before SCW test (text)", dtype: "text", source: "computed", test_code: "ir", formula: "f(ir.bt.lv_e, 2) + ' GΩ'", stage: "pre", report_label: "LV winding with respect to HV winding & tank connected together and earthed. || Before SCW test", order: 763}
  - {key: "rep.ir.bt.hv_lv", label: "IR hv_lv Before SCW test (text)", dtype: "text", source: "computed", test_code: "ir", formula: "f(ir.bt.hv_lv, 2) + ' GΩ'", stage: "pre", report_label: "HV winding with respect to LV winding with tank earthed. || Before SCW test", order: 764}
  - {key: "rep.iov.bt", label: "Induced over-voltage result Before SCW test", dtype: "text", source: "computed", test_code: "induced", formula: "f(iov.bt.v, 0) + ' V, ' + f(iov.bt.hz, 0) + ' Hz for ' + f(iov.bt.s, 0) + ' s\\n' + withstood('induced_bt', iov.bt.obs)", stage: "post", report_label: "LV winding by keeping HV winding open circuit || Before SCW test", order: 765}
  - {key: "rep.sep.bt", label: "Separate source withstand result Before SCW test", dtype: "text", source: "computed", test_code: "sep_source", formula: "f(hvpf.bt.kv, 1) + ' kV for ' + f(hvpf.bt.s, 0) + ' s\\n' + withstood('hvpf_bt', hvpf.bt.obs) + '\\n\\n\\n' + f(lvpf.bt.kv, 1) + ' kV for ' + f(lvpf.bt.s, 0) + ' s\\n' + withstood('lvpf_bt', lvpf.bt.obs)", stage: "post", report_label: "a) HV winding and all terminals of LV winding & tank connected together to earth b) LV winding and all terminals of HV winding & tank connected together to earth || Before SCW test", order: 766}
  - {key: "rep.ir.at.hv_e", label: "IR hv_e After SCW test (text)", dtype: "text", source: "computed", test_code: "ir", formula: "f(ir.at.hv_e, 2) + ' GΩ'", stage: "pre", report_label: "HV winding with respect to LV winding & tank connected together and earthed. || After SCW test", order: 767}
  - {key: "rep.ir.at.lv_e", label: "IR lv_e After SCW test (text)", dtype: "text", source: "computed", test_code: "ir", formula: "f(ir.at.lv_e, 2) + ' GΩ'", stage: "pre", report_label: "LV winding with respect to HV winding & tank connected together and earthed. || After SCW test", order: 768}
  - {key: "rep.ir.at.hv_lv", label: "IR hv_lv After SCW test (text)", dtype: "text", source: "computed", test_code: "ir", formula: "f(ir.at.hv_lv, 2) + ' GΩ'", stage: "pre", report_label: "HV winding with respect to LV winding with tank earthed. || After SCW test", order: 769}
  - {key: "rep.iov.at", label: "Induced over-voltage result After SCW test", dtype: "text", source: "computed", test_code: "induced", formula: "f(iov.at.v, 0) + ' V, ' + f(iov.at.hz, 0) + ' Hz for ' + f(iov.at.s, 0) + ' s\\n' + withstood('induced_at', iov.at.obs)", stage: "post", report_label: "LV winding by keeping HV winding open circuit || After SCW test", order: 770}
  - {key: "rep.sep.at", label: "Separate source withstand result After SCW test", dtype: "text", source: "computed", test_code: "sep_source", formula: "f(hvpf.at.kv, 1) + ' kV for ' + f(hvpf.at.s, 0) + ' s\\n' + withstood('hvpf_at', hvpf.at.obs) + '\\n\\n\\n' + f(lvpf.at.kv, 1) + ' kV for ' + f(lvpf.at.s, 0) + ' s\\n' + withstood('lvpf_at', lvpf.at.obs)", stage: "post", report_label: "a) HV winding and all terminals of LV winding & tank connected together to earth b) LV winding and all terminals of HV winding & tank connected together to earth || After SCW test", order: 771}
  - {key: "rep.osc.s002.obs", label: "Oscillogram S002 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s002') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S002 || Observation", order: 772}
  - {key: "rep.osc.s003.obs", label: "Oscillogram S003 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s003') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S003 || Observation", order: 773}
  - {key: "rep.osc.s004.obs", label: "Oscillogram S004 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s004') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S004 || Observation", order: 774}
  - {key: "rep.osc.s005.obs", label: "Oscillogram S005 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s005') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S005 || Observation", order: 775}
  - {key: "rep.osc.s006.obs", label: "Oscillogram S006 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s006') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S006 || Observation", order: 776}
  - {key: "rep.osc.s007.obs", label: "Oscillogram S007 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s007') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S007 || Observation", order: 777}
  - {key: "rep.osc.s008.obs", label: "Oscillogram S008 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s008') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S008 || Observation", order: 778}
  - {key: "rep.osc.s009.obs", label: "Oscillogram S009 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s009') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S009 || Observation", order: 779}
  - {key: "rep.osc.s010.obs", label: "Oscillogram S010 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_peak_s010') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S010 || Observation", order: 780}
  - {key: "rep.osc.s011.obs", label: "Oscillogram S011 observation", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'No abnormality' if rule_ok('sc_thermal') and test_ok('sc_withstand') else 'Refer remarks'", stage: "post", report_label: "S011 || Observation", order: 781}
  - {key: "rep.xr_conclusion", label: "Reactance conclusion", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'Variation of reactance is within limits' if rules_ok('xchg_') else 'Variation of reactance is NOT within limits'", stage: "post", order: 782}
  - {key: "rep.sc.condition", label: "Condition before SC test", dtype: "text", source: "computed", test_code: "sc_withstand", formula: "'Transformer as after routine tests' if contains(s(sc.hdr.condition, 'routine'), 'routine') else s(sc.hdr.condition)", stage: "pre", report_label: "Condition before test || Test sample", order: 783}
  - {key: "rep.tr.top.g", label: "Top oil guaranteed limit", unit: "°C", dtype: "number", dp: 0, source: "computed", test_code: "temp_rise", formula: "num(form.pf_gtr_top_oil, lim.std_top_oil_rise)", stage: "pre", report_label: "Top oil || Guaranteed Limit declared by the manufacturer (°C)", order: 784}
  - {key: "rep.tr.top.std", label: "Top oil standard limit", unit: "°C", dtype: "number", dp: 0, source: "computed", test_code: "temp_rise", formula: "lim.std_top_oil_rise", stage: "pre", report_label: "Top oil || Limit as per the standard (°C)", order: 785}
  - {key: "rep.tr.top.obs", label: "Top oil observation", dtype: "text", source: "computed", test_code: "temp_rise", formula: "obs('tr_top_oil')", stage: "post", report_label: "Top oil || Observations", order: 786}
  - {key: "rep.tr.hv.g", label: "HV winding guaranteed limit", unit: "°C", dtype: "number", dp: 0, source: "computed", test_code: "temp_rise", formula: "num(form.pf_gtr_winding, lim.std_winding_rise)", stage: "pre", report_label: "HV winding || Guaranteed Limit declared by the manufacturer (°C)", order: 787}
  - {key: "rep.tr.hv.std", label: "HV winding standard limit", unit: "°C", dtype: "number", dp: 0, source: "computed", test_code: "temp_rise", formula: "lim.std_winding_rise", stage: "pre", report_label: "HV winding || Limit as per the standard (°C)", order: 788}
  - {key: "rep.tr.hv.obs", label: "HV winding observation", dtype: "text", source: "computed", test_code: "temp_rise", formula: "obs('tr_hv')", stage: "post", report_label: "HV winding || Observations", order: 789}
  - {key: "rep.tr.lv.g", label: "LV winding guaranteed limit", unit: "°C", dtype: "number", dp: 0, source: "computed", test_code: "temp_rise", formula: "num(form.pf_gtr_winding, lim.std_winding_rise)", stage: "pre", report_label: "LV winding || Guaranteed Limit declared by the manufacturer (°C)", order: 790}
  - {key: "rep.tr.lv.std", label: "LV winding standard limit", unit: "°C", dtype: "number", dp: 0, source: "computed", test_code: "temp_rise", formula: "lim.std_winding_rise", stage: "pre", report_label: "LV winding || Limit as per the standard (°C)", order: 791}
  - {key: "rep.tr.lv.obs", label: "LV winding observation", dtype: "text", source: "computed", test_code: "temp_rise", formula: "obs('tr_lv')", stage: "post", report_label: "LV winding || Observations", order: 792}
  - {key: "rep.ol.obs", label: "Oil leakage observation (report)", dtype: "text", source: "computed", test_code: "oil_leak", formula: "s(ol.obs) if test_ok('oil_leak') else s(ol.obs) + ' (not within limits)'", stage: "post", report_label: " || Observations OIL LEAKAGE TEST", order: 793}
  - {key: "rep.prr.obs", label: "Routine pressure observation (report)", dtype: "text", source: "computed", test_code: "pressure_routine", formula: "s(prr.obs) if test_ok('pressure_routine') else s(prr.obs) + ' (not within limits)'", stage: "post", report_label: " || Observations PRESSURE (ROUTINE TEST)", order: 794}
  - {key: "rep.prt.obs", label: "Air pressure test observation", dtype: "text", source: "computed", test_code: "pressure_type", formula: "'Within limits' if rule_ok('prt_defl') and rule_ok('prt_obs') else 'Not within limits'", stage: "post", report_label: " || Observations Air Pressure test", order: 795}
  - {key: "rep.prv.obs", label: "Vacuum test observation", dtype: "text", source: "computed", test_code: "pressure_type", formula: "'Within limits' if rule_ok('prv_defl') and rule_ok('prv_obs') else 'Not within limits'", stage: "post", report_label: " || Observations Vacuum test", order: 796}
  - {key: "rep.nlc.v100", label: "Rated LV voltage (100 %)", dtype: "text", source: "computed", formula: "f(form.pf_lv_v, 0)", stage: "pre", report_label: "At 100 percent rated voltage", order: 797}
  - {key: "rep.nlc.v112", label: "112.5 % of rated LV voltage", dtype: "text", source: "computed", formula: "f(num(form.pf_lv_v) * 1.125, 0)", stage: "pre", report_label: "At 112.5 percent rated voltage", order: 798}
  - {key: "rep.nlc.lim100", label: "NLC limit at 100 % V", dtype: "text", source: "computed", formula: "f(lim.nlc_limit_100_pct, 0) + ' %'", stage: "pre", report_label: " || Average no-load current At 100 percent rated voltage Permissible value given in the standard", order: 799}
  - {key: "rep.nlc.m100", label: "NLC measured at 100 % V", dtype: "text", source: "computed", formula: "f(calc.nlc100.bt, 2) + ' %'", stage: "pre", report_label: " || Average no-load current At 100 percent rated voltage Measured value", order: 800}
  - {key: "rep.nlc.lim112", label: "NLC limit at 112.5 % V", dtype: "text", source: "computed", formula: "f(lim.nlc_limit_112_pct, 0) + ' %'", stage: "pre", report_label: " || Average no-load current At 112.5 percent rated voltage Permissible value given in the standard", order: 801}
  - {key: "rep.nlc.m112", label: "NLC measured at 112.5 % V", dtype: "text", source: "computed", test_code: "nlc_112", formula: "f(calc.nlc112, 2) + ' %'", stage: "pre", report_label: " || Average no-load current At 112.5 percent rated voltage Measured value", order: 802}
  - {key: "rep.complies_text", label: "Conclusion wording", dtype: "text", source: "computed", formula: "'complies with' if all_rules_ok() else 'does not comply with'", stage: "post", order: 803}
  - {key: "rep.sp.test_sample", label: "Test sample", dtype: "text", source: "computed", formula: "phases_word() + ' Phase ' + sample_name()", stage: "pre", report_label: "Test sample || DESCRIPTION OF SAMPLE TESTED", order: 804}
  - {key: "rep.sp.type", label: "Type", dtype: "text", source: "computed", formula: "s(form.sample_type) or join_nonempty(', ', form.pf_location, form.pf_sealing, form.pf_insulation)", stage: "pre", report_label: "Type || DESCRIPTION OF SAMPLE TESTED", multi: true, order: 805}
  - {key: "rep.sp.serial", label: "Serial number", dtype: "text", source: "computed", formula: "s(form.serial_numbers)", stage: "pre", report_label: "Serial number || DESCRIPTION OF SAMPLE TESTED", multi: true, order: 806}
  - {key: "rep.sp.rated_power", label: "Rated power", dtype: "text", source: "computed", formula: "s(form.pf_kva) + ' kVA'", stage: "pre", report_label: "Rated power || DESCRIPTION OF SAMPLE TESTED", order: 807}
  - {key: "rep.sp.rated_voltage", label: "Rated voltage – HV / LV", dtype: "text", source: "computed", formula: "s(form.pf_hv_v) + ' V / ' + s(form.pf_lv_v) + ' V'", stage: "pre", report_label: "Rated voltage – HV / LV || DESCRIPTION OF SAMPLE TESTED", order: 808}
  - {key: "rep.sp.um", label: "Highest voltage of the equipment – Um", dtype: "text", source: "computed", formula: "s(form.pf_um) + ' kV'", stage: "pre", report_label: "Highest voltage of the equipment – Um || DESCRIPTION OF SAMPLE TESTED", order: 809}
  - {key: "rep.sp.hv_ins", label: "HV LI / AC", dtype: "text", source: "computed", formula: "s(form.pf_hv_li, '-') + ' kVp / ' + s(form.pf_hv_ac, '-') + ' kVrms'", stage: "pre", report_label: "HV LI / AC || DESCRIPTION OF SAMPLE TESTED", order: 810}
  - {key: "rep.sp.lv_ins", label: "LV LI / AC", dtype: "text", source: "computed", formula: "s(form.pf_lv_li, '-') + ' / ' + s(form.pf_lv_ac, '-') + ' kVrms'", stage: "pre", report_label: "LV LI / AC || DESCRIPTION OF SAMPLE TESTED", order: 811}
  - {key: "rep.sp.impedance", label: "Impedance (Percent)", dtype: "text", source: "computed", formula: "f(form.pf_impedance, 2) + ' %'", stage: "pre", report_label: "Impedance (Percent) || DESCRIPTION OF SAMPLE TESTED", order: 812}
  - {key: "rep.sp.phases", label: "Number of phases", dtype: "text", source: "computed", formula: "phases_word()", stage: "pre", report_label: "Number of phases || DESCRIPTION OF SAMPLE TESTED", order: 813}
  - {key: "rep.sp.freq", label: "Rated frequency", dtype: "text", source: "computed", formula: "s(form.pf_freq, '50') + ' Hz'", stage: "pre", report_label: "Rated frequency || DESCRIPTION OF SAMPLE TESTED", order: 814}
  - {key: "rep.sp.vector_group", label: "Vector group", dtype: "text", source: "computed", formula: "s(form.pf_vector_group)", stage: "pre", report_label: "Vector group || DESCRIPTION OF SAMPLE TESTED", order: 815}
  - {key: "rep.sp.tappings", label: "Tappings", dtype: "text", source: "computed", formula: "tap_text()", stage: "pre", report_label: "Tappings || DESCRIPTION OF SAMPLE TESTED", order: 816}
  - {key: "rep.sp.eel", label: "Energy efficiency", dtype: "text", source: "computed", formula: "'Energy Efficiency Level - ' + s(form.pf_eel).replace('EEL-', '')", stage: "pre", report_label: "Energy efficiency || DESCRIPTION OF SAMPLE TESTED", order: 817}
  - {key: "rep.sp.cooling", label: "Type of cooling", dtype: "text", source: "computed", formula: "s(form.pf_cooling)", stage: "pre", report_label: "Type of cooling || DESCRIPTION OF SAMPLE TESTED", order: 818}
  - {key: "rep.sp.max_tl50", label: "Maximum total loss at 50% load", dtype: "text", source: "computed", formula: "s(form.pf_max_tl50) + ' W'", stage: "pre", report_label: "Maximum total loss at 50% load || DESCRIPTION OF SAMPLE TESTED", order: 819}
  - {key: "rep.sp.max_tl100", label: "Maximum total loss at 100% load", dtype: "text", source: "computed", formula: "s(form.pf_max_tl100) + ' W'", stage: "pre", report_label: "Maximum total loss at 100% load || DESCRIPTION OF SAMPLE TESTED", order: 820}
  - {key: "rep.sp.coil", label: "Coil", dtype: "text", source: "computed", formula: "s(form.pf_winding_material) + ', ' + s(form.pf_coil_shape)", stage: "pre", report_label: "Coil || DESCRIPTION OF SAMPLE TESTED", order: 821}
  - {key: "rep.sp.core", label: "Core material", dtype: "text", source: "computed", formula: "s(form.pf_core)", stage: "pre", report_label: "Core material || DESCRIPTION OF SAMPLE TESTED", order: 822}
  - {key: "rep.sp.mfg", label: "Month & Year of Manufacture", dtype: "text", source: "computed", formula: "month_year(form.pf_mfg)", stage: "pre", report_label: "Month & Year of Manufacture || DESCRIPTION OF SAMPLE TESTED", order: 823}
  - {key: "rep.sp.oil", label: "Volume of oil", dtype: "text", source: "computed", formula: "s(form.pf_oil_volume) + ' litres'", stage: "pre", report_label: "Volume of oil || DESCRIPTION OF SAMPLE TESTED", order: 824}
  - {key: "rep.sp.lv_winding", label: "L.V. winding", dtype: "text", source: "computed", formula: "'Type          : ' + s(form.pf_lv_winding) + '\\nConductor : ' + s(form.pf_winding_material)", stage: "pre", report_label: "L.V. winding || DESCRIPTION OF SAMPLE TESTED", order: 825}
  - {key: "rep.sp.hv_winding", label: "H.V. winding", dtype: "text", source: "computed", formula: "'Type          : ' + s(form.pf_hv_winding) + '\\nConductor : ' + s(form.pf_winding_material)", stage: "pre", report_label: "H.V. winding || DESCRIPTION OF SAMPLE TESTED", order: 826}
  - {key: "rep.customer_block", label: "Customer name and address", dtype: "text", source: "computed", formula: "s(form.customer_name) + '\\n' + s(form.customer_address)", stage: "pre", report_label: "Name and Address of the Customer", order: 827}
  - {key: "rep.manufacturer_block", label: "Manufacturer name and address", dtype: "text", source: "computed", formula: "s(form.manufacturer)", stage: "pre", report_label: "Name and Address of the Manufacturer", order: 828}
  - {key: "rep.particulars", label: "Particulars of sample tested", dtype: "text", source: "computed", formula: "s(form.pf_kva) + ' kVA, ' + s(form.pf_hv_v) + ' / ' + s(form.pf_lv_v) + ' V, ' + phases_word() + ' Phase\\n' + sample_name()", stage: "pre", report_label: "Particulars of sample tested", order: 829}
  - {key: "rep.n_samples_words", label: "Number of samples (words)", dtype: "text", source: "computed", formula: "words(num(form.num_samples, 1))", stage: "pre", report_label: "Number of samples tested", order: 830}
  - {key: "rep.customer_requirement", label: "Customer requirement (report)", dtype: "text", source: "computed", formula: "s(form.customer_requirement, 'Nil') or 'Nil'", stage: "pre", report_label: "Customer's requirement", order: 831}
  - {key: "rep.witness_customer", label: "Customer's representative (report)", dtype: "text", source: "computed", formula: "s(form.witness_customer, 'None') or 'None'", stage: "pre", report_label: "Customer's representative", order: 832}
  - {key: "rep.witness_other", label: "Other witness (report)", dtype: "text", source: "computed", formula: "s(form.witness_other, 'None') or 'None'", stage: "pre", report_label: "Other than customer's representative", order: 833}

  # ---------------- system
  - {key: "sys.report_no", label: "Test report number", dtype: "text", source: "system", report_label: "Test Report Number", multi: true, order: 834}
