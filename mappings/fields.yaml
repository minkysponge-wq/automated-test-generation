# =====================================================================
# ATRG field mapping - SINGLE SOURCE OF TRUTH
# ---------------------------------------------------------------------
# Every reading the system knows about is declared here exactly once.
# The same key is used by:
#   * the Excel logsheet templates   (cell token {{key}} + defined name key_with_underscores)
#   * the Excel importer             (app/excel_io.py)
#   * the readings table             (readings.key)
#   * rule checks and calculations   (app/rules.py)
#   * the Word report context        (app/report.py)
#
# Field attributes
#   key       unique dotted key           label    human label
#   unit      engineering unit            type     number | text | date
#   station   which Excel logsheet holds it (see `stations`)
#   test      requested-test code the field belongs to (see `tests`);
#             a field is only required when its test was requested
#   required  must be filled when its test is requested
#   dp        decimal places used when the value is printed in the report
#   sheet/section/row/col   layout hints for tools/make_excel_templates.py
# =====================================================================

stations:
  losses:   {title: "Losses & Winding Resistance", logsheet: "Log-sheet for loss measurement + Datasheet for losses calculation", file: "losses.xlsx"}
  routine:  {title: "Routine Tests", logsheet: "Log sheet for routine tests on transformers", file: "routine.xlsx"}
  sc:       {title: "Short-Circuit Withstand", logsheet: "Log-sheet for short circuit test on transformers", file: "short_circuit.xlsx"}
  temprise: {title: "Temperature Rise", logsheet: "Log sheet for temperature-rise test", file: "temperature_rise.xlsx"}
  pressure: {title: "Pressure & Oil Leakage", logsheet: "Log sheet for air pressure tests and oil leakage test", file: "pressure_oil_leakage.xlsx"}

# Requested tests = the "Schedule of tests" table of the CPRI report template.
tests:
  sc_withstand:     {label: "Short-circuit withstand test (dynamic + thermal)", clause: "21.4 b)", group: special, station: sc}
  nlc_112:          {label: "No-load current at 112.5 % voltage", clause: "21.4 c)", group: special, station: losses}
  temp_rise:        {label: "Temperature-rise test", clause: "21.3 b)", group: type, station: temprise}
  pressure_type:    {label: "Pressure test", clause: "21.3 d)", group: type, station: pressure}
  winding_res:      {label: "Measurement of winding resistance", clause: "21.2 a)", group: routine, station: losses}
  ratio:            {label: "Measurement of voltage ratio and check of phase displacement (vector group)", clause: "21.2 b)", group: routine, station: routine}
  impedance:        {label: "Measurement of short-circuit impedance and load loss", clause: "21.2 c)", group: routine, station: losses}
  nll:              {label: "Measurement of no-load loss and current", clause: "21.2 d)", group: routine, station: losses}
  ir:               {label: "Measurement of insulation resistance", clause: "21.2 e)", group: routine, station: routine}
  induced:          {label: "Induced over-voltage withstand test", clause: "21.2 f)", group: routine, station: routine}
  sep_source:       {label: "Separate source voltage withstand test", clause: "21.2 g)", group: routine, station: routine}
  pressure_routine: {label: "Pressure test (routine)", clause: "21.2 h)", group: routine, station: pressure}
  oil_leak:         {label: "Oil leakage test", clause: "21.2 j)", group: routine, station: pressure}

