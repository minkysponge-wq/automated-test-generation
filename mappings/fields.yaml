# =====================================================================
# ATRG FIELD REGISTRY - seed data (single source of truth)
# ---------------------------------------------------------------------
# Loaded into the `field_registry` table on first start. After that the
# registry is edited in the Admin portal and changes take effect only
# after HOD approval. Every consumer reads the registry:
#   * request form + proforma web form   (source: request / proforma)
#   * AI extraction schema               (source: request / proforma / reading)
#   * Excel logsheet templates + importer (source: reading; sheet/section/row/col)
#   * rules.yaml and computed formulas   (simpleeval - never Python eval)
#   * report template auto-mapper        (report_label "row || column/heading")
#
# Attributes
#   key          unique dotted key (Excel defined name = dots -> underscores)
#   source       reading | request | proforma | computed | system
#   dtype        number | text | date | list | image
#   dp           decimals printed in the report
#   test_code    test (mappings/tests.yaml) the field belongs to; required only if that test is requested
#   formula      computed fields: safe expression over other keys, e.g. r75(avg(wr.hv.n.bt.uv, ...), wtemp('bt'))
#   stage        pre (before rules) | post (may use rule outcomes: obs(), rule_ok(), test_ok())
#   multi        may fill several report slots (report number, date, ...)
# =====================================================================

fields:

