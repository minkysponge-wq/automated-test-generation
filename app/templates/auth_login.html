{% extends "base.html" %}
{% block title %}{{ meta.title }} - Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-icon">{{ meta.icon }}</div>
    <h1>{{ meta.title }}</h1>
    <p class="muted">{{ meta.blurb }}</p>
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username <input name="username" required autofocus></label>
      <label>Password <input name="password" type="password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-alt">No account? <a href="{{ url_for(role ~ '.register') }}">Register as {{ role }}</a></p>
    <p class="auth-alt small"><a href="{{ url_for('public.landing') }}">← choose another portal</a></p>
  </div>
</div>
{% endblock %}
