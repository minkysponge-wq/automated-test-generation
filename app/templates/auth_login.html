{% extends "base.html" %}
{% block title %}Sign in - {{ meta.long }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="panel">
    <div class="panel-body">
      <h1>{{ meta.long }}</h1>
      <p class="muted">{{ meta.blurb }}</p>
      <form method="post" autocomplete="on" style="margin-top:16px">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username <input name="username" required autofocus autocomplete="username"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <div class="form-actions" style="justify-content:space-between">
          {% if role != 'hod' %}<a href="{{ url_for(role ~ '.register') }}">Create an account</a>{% else %}<span class="small muted">HOD accounts are created by an existing HOD.</span>{% endif %}
          <button class="btn btn-primary" type="submit">Sign in</button>
        </div>
      </form>
    </div>
  </div>
  <p class="small"><a href="{{ url_for('public.landing') }}">Other portals</a></p>
</div>
{% endblock %}
